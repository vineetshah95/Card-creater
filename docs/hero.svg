<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="Card Creater preview">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a1628"/><stop offset="1" stop-color="#ff7b9c"/></linearGradient>
    <linearGradient id="cover" x1="0" x2="1"><stop offset="0" stop-color="#9a3d52"/><stop offset="1" stop-color="#c45c6a"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1200" height="520" rx="24" fill="url(#bg)"/>
  <g fill="#fff0a6"><circle cx="90" cy="70" r="6"/><circle cx="1120" cy="90" r="5"/><circle cx="1040" cy="450" r="7"/></g>
  <g fill="#7ec8e3"><rect x="180" y="40" width="10" height="18" rx="2" transform="rotate(25 185 49)"/><rect x="960" y="40" width="10" height="18" rx="2" transform="rotate(-20 965 49)"/></g>
  <g fill="#c4a8ff"><rect x="70" y="430" width="10" height="18" rx="2" transform="rotate(-30 75 439)"/><rect x="1130" y="300" width="10" height="18" rx="2" transform="rotate(15 1135 309)"/></g>
  <text x="600" y="78" text-anchor="middle" font-family="Georgia, serif" font-size="38" font-weight="700" fill="#fff">The Glitter &amp; Giggle Birthday Lab</text>
  <text x="600" y="112" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#ffe9ef">Relationship-aware jokes · tone control · stackable cards · PNG / PDF / Story export</text>
  <!-- form panel -->
  <g filter="url(#sh)">
    <rect x="70" y="150" width="400" height="320" rx="18" fill="#fffaf8"/>
  </g>
  <g font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5a4552">
    <text x="94" y="188" font-weight="700">Who it's for</text><rect x="94" y="196" width="170" height="32" rx="8" fill="#fff" stroke="#e8d5dc"/><text x="106" y="217">Friend</text>
    <text x="284" y="188" font-weight="700">Tone</text><rect x="284" y="196" width="166" height="32" rx="8" fill="#fff" stroke="#e8d5dc"/><text x="296" y="217">Cheeky</text>
    <text x="94" y="256" font-weight="700">Their name</text><rect x="94" y="264" width="356" height="32" rx="8" fill="#fff" stroke="#e8d5dc"/><text x="106" y="285">Jordan</text>
    <text x="94" y="324" font-weight="700">Age they're turning</text><rect x="94" y="332" width="356" height="32" rx="8" fill="#fff" stroke="#e8d5dc"/><text x="106" y="353">32</text>
    <text x="94" y="392" font-weight="700">Hobbies</text><rect x="94" y="400" width="356" height="32" rx="8" fill="#fff" stroke="#e8d5dc"/><text x="106" y="421">sourdough, chess, long walks</text>
  </g>
  <rect x="94" y="438" width="356" height="0" fill="none"/>
  <!-- card -->
  <g filter="url(#sh)">
    <rect x="540" y="150" width="590" height="320" rx="14" fill="url(#cover)"/>
    <rect x="560" y="165" width="550" height="290" rx="10" fill="#fffdf9"/>
    <rect x="560" y="165" width="275" height="290" rx="10" fill="#fbeef2"/>
    <line x1="835" y1="165" x2="835" y2="455" stroke="#eadbe0"/>
  </g>
  <text x="697" y="330" text-anchor="middle" font-family="Georgia, serif" font-size="86" font-weight="700" fill="#f3d3dc">HB</text>
  <text x="972" y="225" text-anchor="middle" font-family="'Brush Script MT', cursive" font-size="40" fill="#c45c6a">Happy Birthday!</text>
  <g font-family="Georgia, serif" font-size="17" fill="#4a3640" text-anchor="middle">
    <text x="972" y="278">Jordan, 32 looks great on you.</text>
    <text x="972" y="306">Sourdough, chess, and long walks?</text>
    <text x="972" y="334">Your calendar is thriving. Cake is mandatory.</text>
  </g>
  <text x="972" y="420" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="15" fill="#9a6a78">With love &amp; cake crumbs</text>
  <rect x="1050" y="125" width="60" height="38" rx="4" fill="#ffe29a" stroke="#d4a84b" stroke-dasharray="4 3" transform="rotate(6 1080 144)"/>
  <text x="1080" y="150" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="16" fill="#8a7020" transform="rotate(6 1080 144)">HB</text>
</svg>
